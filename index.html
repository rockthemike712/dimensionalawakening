<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%2350f2ff%22/></svg>" />
<title>Dimensional Awakening — V7</title>
<style>
  * { box-sizing:border-box; }
  html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#eafcff;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    overscroll-behavior:none;touch-action:none}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none}
  #title{position:absolute;top:max(16px,env(safe-area-inset-top));left:20px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;animation:titleIn 1.6s cubic-bezier(.2,.7,.3,1)}
  @keyframes titleIn{from{opacity:0;letter-spacing:.6em;filter:blur(4px)}to{opacity:.6;letter-spacing:.22em;filter:blur(0)}}
  #count{position:absolute;top:max(16px,env(safe-area-inset-top));right:20px;font-size:12px;opacity:.68;letter-spacing:.12em}
  #pips{position:absolute;top:calc(max(16px,env(safe-area-inset-top)) + 22px);right:22px;display:flex;gap:8px}
  #pips i{width:7px;height:7px;transform:rotate(45deg);border:1px solid rgba(140,250,255,.5);transition:background .3s,box-shadow .3s,border-color .3s}
  #pips i.lit{background:#aefcff;border-color:#aefcff;box-shadow:0 0 12px #65f7ff;animation:pipPop .5s cubic-bezier(.22,2.4,.5,1)}
  @keyframes pipPop{0%{transform:rotate(45deg) scale(.3)}55%{transform:rotate(45deg) scale(1.8)}100%{transform:rotate(45deg) scale(1)}}
  #dimLabel{position:absolute;left:20px;top:calc(max(16px,env(safe-area-inset-top)) + 20px);font-size:10px;letter-spacing:.3em;opacity:.45;transition:opacity .6s,letter-spacing .8s}
  #prompt{position:absolute;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 170px);transform:translateX(-50%);
    padding:10px 16px;border:1px solid rgba(180,245,255,.18);border-radius:999px;background:rgba(1,5,14,.5);
    backdrop-filter:blur(10px);font-size:14px;max-width:78vw;text-align:center;
    transition:opacity .3s,filter .45s,letter-spacing .45s;
    box-shadow:0 0 28px rgba(0,230,255,.06)}
  #prompt.swap{opacity:.06;filter:blur(7px);letter-spacing:.14em}
  #moveStatus{position:absolute;left:50%;top:calc(max(16px,env(safe-area-inset-top)) + 34px);transform:translateX(-50%);
    font:700 12px ui-monospace,monospace;color:#dfffff;opacity:.75;letter-spacing:.1em;transition:opacity .6s}
  #moveStatus.tick{animation:statusTick .28s cubic-bezier(.22,2,.5,1)}
  @keyframes statusTick{0%{transform:translateX(-50%) scale(1.3)}100%{transform:translateX(-50%) scale(1)}}
  #beaconArrow{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:34px;color:#bffcff;transition:opacity .4s}
  #beaconArrow span{display:inline-block;text-shadow:0 0 18px #65f7ff;animation:arrowBreathe 1.5s ease-in-out infinite}
  @keyframes arrowBreathe{0%,100%{transform:scale(1);text-shadow:0 0 14px #65f7ff}50%{transform:scale(1.22);text-shadow:0 0 26px #8ffcff}}
  #flash{position:absolute;inset:0;background:white;opacity:0;transition:opacity .18s;mix-blend-mode:difference}
  #dpad{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));
    width:150px;height:150px;pointer-events:auto;filter:drop-shadow(0 0 18px rgba(80,245,255,.16));
    transition:opacity .5s,transform .22s cubic-bezier(.2,.9,.3,1.3)}
  .dkey{position:absolute;-webkit-appearance:none;appearance:none;width:48px;height:48px;
    border:1px solid rgba(130,245,255,.32);background:rgba(3,18,30,.72);color:#dfffff;border-radius:12px;
    font:700 20px/1 system-ui;display:grid;place-items:center;touch-action:none;cursor:pointer;
    box-shadow:inset 0 0 18px rgba(0,230,255,.05);
    transition:transform .18s cubic-bezier(.22,2.2,.5,1),background .12s,border-color .12s,box-shadow .12s}
  .dkey span{display:block;transition:transform .14s cubic-bezier(.22,2.2,.5,1)}
  .dkey::before{content:"";position:absolute;opacity:.3;transition:opacity .15s;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(120,245,255,.9),transparent)}
  #up::before{top:3px;left:10px;right:10px;height:2px}
  #down::before{bottom:3px;left:10px;right:10px;height:2px}
  #left::before,#right::before{background:linear-gradient(180deg,transparent,rgba(120,245,255,.9),transparent)}
  #left::before{left:3px;top:10px;bottom:10px;width:2px}
  #right::before{right:3px;top:10px;bottom:10px;width:2px}
  .dkey::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(150,250,255,.9);opacity:0;pointer-events:none}
  .dkey.pulse::after{animation:keyRipple .5s ease-out}
  @keyframes keyRipple{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
  .dkey.held{background:rgba(45,220,255,.3);border-color:rgba(160,255,255,.85);box-shadow:0 0 20px rgba(80,245,255,.3);transform:scale(.9)}
  .dkey.held::before{opacity:1}
  #up.held span{transform:translateY(-3px)}#down.held span{transform:translateY(3px)}
  #left.held span{transform:translateX(-3px)}#right.held span{transform:translateX(3px)}
  .dkey:focus-visible{outline:1px solid rgba(170,255,255,.9);outline-offset:3px}
  #up{left:51px;top:0}#left{left:0;top:51px}#down{left:51px;top:102px}#right{left:102px;top:51px}
  #foldHint{position:absolute;right:20px;bottom:max(18px,env(safe-area-inset-bottom));font-size:11px;opacity:.45;text-align:right;line-height:1.6;letter-spacing:.06em}
  #veil{position:absolute;inset:0;background:#010208;opacity:0;transition:opacity .35s;pointer-events:none}
  #eye{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 64px);
    width:58px;height:58px;border-radius:50%;display:none;place-items:center;pointer-events:auto;cursor:pointer;
    -webkit-appearance:none;appearance:none;border:1px solid rgba(130,245,255,.32);background:rgba(3,18,30,.72);
    color:#dfffff;touch-action:none;box-shadow:inset 0 0 18px rgba(0,230,255,.05);
    animation:eyeBreathe 3.2s ease-in-out infinite;transition:background .15s,border-color .15s}
  @keyframes eyeBreathe{0%,100%{box-shadow:inset 0 0 18px rgba(0,230,255,.05),0 0 10px rgba(80,245,255,.1)}50%{box-shadow:inset 0 0 18px rgba(0,230,255,.1),0 0 22px rgba(80,245,255,.3)}}
  #eye svg{overflow:visible;transition:transform .16s ease-in}
  #eye .pupil{transform-origin:13px 9px;transition:transform .16s}
  #eye.held{background:rgba(45,220,255,.3);border-color:rgba(160,255,255,.85);animation:none}
  #eye.held svg{transform:scaleY(.12)}
  #eye.held .pupil{transform:scale(.2)}
  #eye:focus-visible{outline:1px solid rgba(170,255,255,.9);outline-offset:3px}
  #eyeLabel{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 44px);
    width:70px;text-align:center;font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;display:none;transition:opacity .6s}
  #resume{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(1,3,10,.55);backdrop-filter:blur(6px);pointer-events:auto;transition:opacity .45s,filter .45s}
  #resume.gone{opacity:0;filter:blur(8px);pointer-events:none}
  #resume .rt{font-size:10px;letter-spacing:.34em;text-transform:uppercase;opacity:.55;margin-bottom:6px;animation:titleIn 1.2s cubic-bezier(.2,.7,.3,1)}
  .pill{-webkit-appearance:none;appearance:none;padding:12px 22px;border:1px solid rgba(180,245,255,.28);border-radius:999px;
    background:rgba(1,5,14,.6);color:#eafcff;font:14px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;
    box-shadow:0 0 28px rgba(0,230,255,.08);position:relative;overflow:visible;
    animation:pillIn .7s cubic-bezier(.2,.7,.3,1) both;transition:transform .18s cubic-bezier(.22,2.2,.5,1),background .12s,border-color .12s}
  .pill+.pill{animation-delay:.12s;opacity:.7}
  .pill::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(150,250,255,.9);opacity:0;pointer-events:none}
  .pill:active{transform:scale(.94);background:rgba(45,220,255,.22);border-color:rgba(160,255,255,.85)}
  .pill:active::after{animation:keyRipple .5s ease-out}
  .pill:focus-visible{outline:1px solid rgba(170,255,255,.9);outline-offset:3px}
  @keyframes pillIn{from{opacity:0;filter:blur(6px);letter-spacing:.3em}to{filter:blur(0);letter-spacing:.04em}}
  /* hold buttons for regions: same body as the eye, stacked above it on the right */
  .hbtn{position:absolute;right:max(16px,env(safe-area-inset-right));width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
    pointer-events:auto;cursor:pointer;-webkit-appearance:none;appearance:none;border:1px solid rgba(130,245,255,.32);background:rgba(3,18,30,.72);
    color:#dfffff;touch-action:none;box-shadow:inset 0 0 18px rgba(0,230,255,.05);animation:eyeBreathe 3.2s ease-in-out infinite;
    transition:background .15s,border-color .15s,transform .18s cubic-bezier(.22,2.2,.5,1),opacity .4s}
  .hbtn.held{background:rgba(45,220,255,.3);border-color:rgba(160,255,255,.85);animation:none;transform:scale(.9)}
  .hbtn:focus-visible{outline:1px solid rgba(170,255,255,.9);outline-offset:3px}
  .hlabel{position:absolute;right:max(10px,env(safe-area-inset-right));width:70px;text-align:center;font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;transition:opacity .6s}
  @media (max-width:700px){
    #foldHint{display:none}
    #prompt{font-size:12px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 162px)}
    #title{font-size:9px}
    #title .sub{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #title,#beaconArrow span,#eye,#pips i.lit{animation:none}
    .dkey,.dkey span,#dpad,#prompt{transition-duration:.01s}
    .dkey.pulse::after{animation:none}
  }
</style>
</head>
<body>
<div id="ui">
  <div id="title">Dimensional Awakening<span class="sub"> / V7</span></div>
  <div id="dimLabel">2D</div>
  <div id="count">LIGHTS 0 / 3</div>
  <div id="pips"><i></i><i></i><i></i></div>
  <div id="moveStatus">TAP AN ARROW TO MOVE</div>
  <div id="beaconArrow"><span>&#8595;</span></div>
  <div id="prompt">Move to the light.</div>
  <div id="foldHint">MOVE &middot; WASD / ARROWS / PAD<br>FOLD &middot; GRAB THE GLOWING EDGE</div>
  <div id="dpad">
    <button class="dkey" id="up" aria-label="Move up"><span>&#8593;</span></button>
    <button class="dkey" id="left" aria-label="Move left"><span>&#8592;</span></button>
    <button class="dkey" id="down" aria-label="Move down"><span>&#8595;</span></button>
    <button class="dkey" id="right" aria-label="Move right"><span>&#8594;</span></button>
  </div>
  <div id="flash"></div>
  <div id="veil"></div>
  <button id="eye" type="button" aria-label="Hold to close your eyes">
    <svg width="28" height="19" viewBox="0 0 26 18" fill="none" aria-hidden="true">
      <path d="M1 9 Q13 -3.5 25 9 Q13 21.5 1 9 Z" stroke="#dfffff" stroke-width="1.4"/>
      <circle class="pupil" cx="13" cy="9" r="3.4" fill="#aefcff"/>
    </svg>
  </button>
  <div id="eyeLabel">hold &middot; close eyes</div>
  <div id="resume">
    <div class="rt">You were standing on the paper</div>
    <button class="pill" id="resumeYes" type="button">Continue</button>
    <button class="pill" id="resumeNo" type="button">Start over</button>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.min.js"}}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
