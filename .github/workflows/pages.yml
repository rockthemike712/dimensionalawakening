name: Deploy to GitHub Pages

# Publishes the site by pushing to the gh-pages branch. GitHub automatically
# enables Pages (source: gh-pages branch) when that branch first appears, so
# no repository-settings step is needed. The previous actions/deploy-pages
# approach failed because the workflow token is not allowed to enable Pages
# via the API ("Resource not accessible by integration").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
