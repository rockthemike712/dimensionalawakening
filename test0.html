<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%2350f2ff%22/></svg>" />
<title>Test 0 — Input Validation</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#000; color:#5ff2ff;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    touch-action: manipulation; -webkit-user-select:none; user-select:none;
    overscroll-behavior:none; }
  #hud { position:fixed; top:max(14px, env(safe-area-inset-top)); left:0; right:0;
    text-align:center; font-size:22px; font-weight:700; letter-spacing:.1em; }
  #log { position:fixed; top:calc(max(14px, env(safe-area-inset-top)) + 34px); left:0; right:0;
    text-align:center; font-size:12px; opacity:.6; }
  #arena { position:fixed; inset:0; }
  .dot { position:absolute; border-radius:50%; }
  #player { width:11vmin; height:11vmin; background:#5ff2ff;
    box-shadow:0 0 40px #5ff2ff, 0 0 90px rgba(95,242,255,.5);
    transition: left .18s ease-out, top .18s ease-out; }
  #goal { width:15vmin; height:15vmin; border:1.2vmin solid #5ff2ff;
    box-shadow:0 0 30px rgba(95,242,255,.6), inset 0 0 30px rgba(95,242,255,.4);
    animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.12); } }
  #pad { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom));
    display:grid; grid-template-columns:repeat(3, 21vmin); grid-template-rows:repeat(2, 21vmin);
    gap:2vmin; justify-content:center; }
  button { -webkit-appearance:none; appearance:none; border-radius:18px; cursor:pointer;
    border:2px solid rgba(95,242,255,.55); background:rgba(95,242,255,.08);
    color:#bffcff; font:700 9vmin/1 ui-monospace, monospace; touch-action:none; }
  button:active { background:rgba(95,242,255,.4); }
  #bU { grid-column:2; grid-row:1; } #bL { grid-column:1; grid-row:2; }
  #bD { grid-column:2; grid-row:2; } #bR { grid-column:3; grid-row:2; }
  #win { position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.85);
    font-size:26px; font-weight:700; text-align:center; line-height:1.6; }
</style>
</head>
<body>
<div id="hud">MOVE: 0</div>
<div id="log">Tap an arrow. The dot must visibly move.</div>
<div id="arena">
  <div class="dot" id="goal"></div>
  <div class="dot" id="player"></div>
</div>
<div id="pad">
  <button id="bU">&#8593;</button>
  <button id="bL">&#8592;</button>
  <button id="bD">&#8595;</button>
  <button id="bR">&#8594;</button>
</div>
<div id="win">REACHED THE GOAL<br>INPUT IS PROVEN &#10003;<br><span style="font-size:14px;opacity:.7">tap anywhere to reset</span></div>
<script>
// Test 0 per docs/HANDOFF.md section 20: prove that a tap produces a large,
// unmistakable movement on a real phone before any Three.js is reintroduced.
var moves = 0, px = 0.2, py = 0.35, gx = 0.78, gy = 0.35;
var STEP = 0.17; // fraction of the arena per tap — 15-20% of screen
var hud = document.getElementById('hud'), log = document.getElementById('log');
var player = document.getElementById('player'), goal = document.getElementById('goal');
var win = document.getElementById('win');

function arenaRect() {
  var pad = document.getElementById('pad').getBoundingClientRect();
  return { w: innerWidth, h: pad.top - 60 };
}
function render() {
  var a = arenaRect();
  player.style.left = (px * a.w - player.offsetWidth / 2) + 'px';
  player.style.top  = (60 + py * a.h - player.offsetHeight / 2) + 'px';
  goal.style.left   = (gx * a.w - goal.offsetWidth / 2) + 'px';
  goal.style.top    = (60 + gy * a.h - goal.offsetHeight / 2) + 'px';
}
function move(dx, dy) {
  px = Math.min(0.94, Math.max(0.06, px + dx * STEP));
  py = Math.min(0.94, Math.max(0.06, py + dy * STEP));
  moves++;
  hud.textContent = 'MOVE: ' + moves;
  log.textContent = 'Input received at ' + new Date().toLocaleTimeString();
  render();
  if (Math.abs(px - gx) < 0.09 && Math.abs(py - gy) < 0.12) {
    win.style.display = 'grid';
  }
  if (navigator.vibrate) navigator.vibrate(15);
}
function bind(id, dx, dy) {
  var b = document.getElementById(id);
  b.addEventListener('pointerdown', function (e) { e.preventDefault(); move(dx, dy); });
  b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
bind('bU', 0, -1); bind('bL', -1, 0); bind('bD', 0, 1); bind('bR', 1, 0);
addEventListener('keydown', function (e) {
  if (e.code === 'ArrowUp' || e.code === 'KeyW') move(0, -1);
  if (e.code === 'ArrowDown' || e.code === 'KeyS') move(0, 1);
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(-1, 0);
  if (e.code === 'ArrowRight' || e.code === 'KeyD') move(1, 0);
});
win.addEventListener('pointerdown', function () {
  win.style.display = 'none'; px = 0.2; py = 0.35; moves = 0;
  hud.textContent = 'MOVE: 0'; render();
});
addEventListener('resize', render);
render();
</script>
</body>
</html>
